<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHΔDØW DL - احترافية التحميل الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg-dark: #0b0e14;
            --card-bg: rgba(255, 255, 255, 0.03);
            --text-main: #ffffff;
            --text-dim: #a0a4b8;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% -20%, #1e2642, var(--bg-dark));
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            display: flex; flex-direction: column;
            min-height: 100vh; align-items: center; justify-content: center;
        }

        /* حاوية التصميم الرئيسية */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 30px;
            width: 90%; max-width: 550px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            animation: slideUp 0.8s ease-out;
        }

        .header-box h1 {
            font-size: 36px; font-weight: 900; margin: 0;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .header-box p { color: var(--text-dim); margin-top: 10px; font-size: 15px; }

        /* منطقة الإدخال */
        .input-wrapper {
            margin-top: 35px; position: relative;
        }

        input {
            width: 100%; padding: 18px 25px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            color: #fff; font-size: 16px; outline: none;
            transition: 0.3s; box-sizing: border-box;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
        }

        /* زر التحميل السحري */
        .main-btn {
            margin-top: 20px; width: 100%; padding: 16px;
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            border: none; border-radius: 16px;
            color: #050505; font-weight: 800; font-size: 18px;
            cursor: pointer; transition: 0.4s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .main-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(79, 172, 254, 0.4);
        }

        /* صندوق النتائج */
        #result-area {
            display: none; margin-top: 30px; padding: 20px;
            border-radius: 16px; background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        /* الأنيميشن */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loader {
            width: 24px; height: 24px;
            border: 3px solid rgba(0,0,0,0.1);
            border-top-color: #000; border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* تذييل الصفحة */
        footer { margin-top: 30px; font-size: 12px; color: #444; }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="header-box">
            <h1>SHΔDØW DL</h1>
            <p>استخرج فيديوهات TikTok و Instagram و Facebook بدون علامة مائية</p>
        </div>

        <div class="input-wrapper">
            <input type="text" id="videoUrl" placeholder="ضع رابط الفيديو هنا...">
        </div>

        <button class="main-btn" id="dlBtn" onclick="handleProDownload()">
            <span id="btnText">بدء الاستخراج الذكي</span>
            <div class="loader" id="btnLoader"></div>
        </button>

        <div id="result-area">
            <div id="status-msg" style="margin-bottom: 15px;">جاري معالجة البيانات...</div>
            <div id="final-link-box"></div>
        </div>
    </div>

    <footer>نظام معالجة آمن • SHΔDØW CORE 2026</footer>

    <script>
        async function handleProDownload() {
            const url = document.getElementById('videoUrl').value;
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const resultArea = document.getElementById('result-area');
            const statusMsg = document.getElementById('status-msg');
            const finalLinkBox = document.getElementById('final-link-box');

            if (!url) {
                alert("يرجى إدخال الرابط أولاً!");
                return;
            }

            // 1. تشغيل "مصيدة الأرباح" - فتح رابط Monetag المباشر
            // استبدل 'YOUR_MONETAG_LINK' برابطك المباشر
            window.open('YOUR_MONETAG_LINK', '_blank');

            // 2. تحديث واجهة المستخدم (Loading State)
            btnText.style.display = "none";
            btnLoader.style.display = "block";
            resultArea.style.display = "block";
            statusMsg.innerHTML = "جاري الاتصال بالسيرفر السحابي...";

            try {
                // 3. استدعاء API التحميل الحقيقي
                const response = await fetch(`https://api.tiklydown.eu.org/api/download?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                if (data.status === 200) {
                    statusMsg.innerHTML = "<span style='color:var(--primary);'>✅ تم العثور على الفيديو بنجاح!</span>";
                    const videoLink = data.result.video.noWatermark || data.result.video.url;
                    
                    finalLinkBox.innerHTML = `
                        <a href="${videoLink}" target="_blank" 
                           style="text-decoration:none; color:black; background:white; padding:12px 25px; border-radius:10px; font-weight:bold; display:inline-block; margin-top:10px;">
                           تحميل الملف الآن
                        </a>
                    `;
                } else {
                    throw new Error();
                }
            } catch (err) {
                statusMsg.innerHTML = "<span style='color:#ff6b6b;'>❌ خطأ في الرابط أو السيرفر مشغول.</span>";
            } finally {
                btnText.style.display = "block";
                btnLoader.style.display = "none";
            }
        }
    </script>

</body>
</html>
