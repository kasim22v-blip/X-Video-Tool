<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikDown Pro | التحميل الاحترافي</title>
    <style>
        :root { 
            --main-color: #fe2c55; 
            --bg-dark: #0a0a0a; 
            --card-bg: #161616; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            background: var(--bg-dark); 
            color: white; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            line-height: 1.6;
            overflow-x: hidden; /* يمنع التشويه الأفقي */
        }

        .navbar { 
            background: var(--card-bg);
            padding: 15px 20px; 
            text-align: center;
            border-bottom: 2px solid var(--main-color);
            font-weight: bold;
            font-size: 1.4rem;
        }

        .hero { padding: 40px 15px; text-align: center; }
        .hero h1 { font-size: 2rem; margin-bottom: 10px; color: white; }
        .hero p { color: #888; font-size: 0.9rem; }

        .main-wrapper {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        .download-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid #222;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #333;
            background: #000;
            color: #fff;
            margin-bottom: 15px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--main-color); }

        button {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: var(--main-color);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { opacity: 0.9; transform: scale(0.98); }

        /* منطقة النتيجة - تمنع التشويه */
        #resultArea {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #000;
            border-radius: 15px;
            text-align: center;
            border: 1px dashed #444;
        }

        .video-thumb {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .download-btn-final {
            display: inline-block;
            background: #25d366;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
        }

        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .f-item {
            background: #111;
            padding: 15px;
            border-radius: 12px;
            font-size: 0.8rem;
            text-align: center;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #444;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="navbar">TikDown <span style="color:var(--main-color)">Pro</span></div>

    <div class="hero">
        <h1>تحميل تيك توك بدون علامة</h1>
        <p>أسرع خدمة مجانية وبجودة عالية</p>
    </div>

    <div class="main-wrapper">
        <div class="download-box">
            <input type="text" id="videoUrl" placeholder="ضع رابط الفيديو هنا...">
            <button id="dlBtn" onclick="processVideo()">تحميل الآن</button>

            <div id="resultArea">
                <img id="thumb" class="video-thumb" src="" alt="">
                <div id="videoTitle" style="font-size:0.8rem; margin-bottom:10px;"></div>
                <a href="#" id="downloadLink" class="download-btn-final">حفظ الفيديو (MP4)</a>
            </div>
        </div>

        <div class="features">
            <div class="f-item">🚀 سرعة فائقة</div>
            <div class="f-item">💎 جودة HD</div>
            <div class="f-item">📱 دعم كامل</div>
            <div class="f-item">🔓 مجاني تماماً</div>
        </div>
    </div>

    <footer>
        © 2026 TikDown Pro - جميع الحقوق محفوظة
    </footer>

    <script>
        async function processVideo() {
            const url = document.getElementById('videoUrl').value;
            const btn = document.getElementById('dlBtn');
            const resultArea = document.getElementById('resultArea');

            if(!url) return alert("يرجى وضع الرابط!");

            btn.innerText = "جاري المعالجة...";
            btn.style.background = "#444";

            try {
                const res = await fetch(`https://www.tikwm.com/api/?url=${url}`);
                const json = await res.json();

                if(json.code === 0) {
                    document.getElementById('thumb').src = json.data.cover;
                    document.getElementById('videoTitle').innerText = json.data.title;
                    document.getElementById('downloadLink').href = json.data.play;
                    resultArea.style.display = "block";
                } else {
                    alert("الرابط غير صحيح أو الفيديو خاص");
                }
            } catch (e) {
                alert("فشل الاتصال بالسيرفر");
            } finally {
                btn.innerText = "تحميل الآن";
                btn.style.background = "#fe2c55";
            }
        }
    </script>
</body>
</html>
